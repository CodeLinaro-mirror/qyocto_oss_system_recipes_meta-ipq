#@TYPE: Machine
#@NAME: IPQ52xx_64 machine
#@DESCRIPTION: ipq52xx_64

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc
include conf/machine/include/arm/armv8a/tune-cortexa72.inc

DEFAULTTUNE = "aarch64"
TARGET_ARCH = "aarch64"
KARCH = "arm64"
DTB_PATH = 'qcom'
SOC_FAMILY = "ipq:ipq52xx_64"
NUM_RADIOS = "radios:3"

MACHINE_FEATURES += "usbhost"

RDEPENDS_${KERNEL_PACKAGE_NAME}-base = ""
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"
PREFERRED_VERSION_lua-native = "5.4.4"
BBMASK .= "|meta-rdk-ext/recipes-connectivity/openssl/openssl_3.0.5.bbappend"
PREFERRED_VERSION_iperf3_kirkstone:forcevariable  = "3.17.1"

DISTRO_FEATURES:append = " systemd "
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_MACHINE = "ipq5210_norplusnand_defconfig"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-2025"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2025"
EXTRA_IMAGEDEPENDS += "u-boot-2025"

LINUX_VERSION ?= "6.6"

NITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"

KERNEL_LOADADDR="0x80000000"
KERNEL_DEVICETREE ="ipq5210-emulation.dtb \
		    ipq5210-emulation-fbc.dtb \
		    ipq5210-rdp497.dtb \
		    ipq5210-rdp498.dtb \
		    ipq5210-rdp499.dtb \
		    ipq5210-rdp500.dtb \
		    ipq5210-rdp501.dtb \
		    ipq5210-rdp502.dtb \
		    ipq5210-rdp503.dtb \
		    ipq5210-rdp504.dtb \
		    ipq5210-rdp505.dtb \
		    ipq5210-rdp511.dtb \
		    ipq5210-rdp512.dtb \
		    ipq5210-db-hm01.1.dtb \
		    ipq5210-db-hm02.1.dtb \
"
CONF_VERSION = "2"
SERIAL_CONSOLE = "115200 ttyMSM0"
