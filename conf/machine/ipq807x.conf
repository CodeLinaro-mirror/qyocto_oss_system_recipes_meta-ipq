#@TYPE: Machine
#@NAME: IPQ807X machine
#@DESCRIPTION: ipq807x

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc

SOC_FAMILY = "ipq:ipq807x"

MACHINE_FEATURES += "usbhost"

RDEPENDS_${KERNEL_PACKAGE_NAME}-base = ""
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"

DISTRO_FEATURES_append = " systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_ARCH = "arm"
UBOOT_MACHINE = "ipq807x_defconfig"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-2016"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2016"
EXTRA_IMAGEDEPENDS += "u-boot-2016"
INITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"
LINUX_VERSION ?= "5.4"

KERNEL_LOADADDR="0x41208000"
KERNEL_DEVICETREE = "ipq8074-hk01.dtb \
		     ipq8074-hk01.c2.dtb \
		     ipq8074-hk01.c3.dtb \
                     ipq8074-hk01.c4.dtb \
                     ipq8074-hk01.c5.dtb \
                     ipq8074-hk02.dtb \
                     ipq8074-hk06.dtb \
                     ipq8074-hk07.dtb \
                     ipq8074-hk08.dtb \
                     ipq8074-hk09.dtb \
                     ipq8074-hk10.dtb \
                     ipq8074-hk10.c2.dtb \
                     ipq8074-hk14.dtb \
                     ipq8074-ac01.dtb \
                     ipq8074-ac02.dtb \
                     ipq8074-oak02.dtb \
                     ipq8074-oak03.dtb \
                     ipq8074-db.hk02.dtb \
		    "

SERIAL_CONSOLE = "115200 ttyMSM0"
