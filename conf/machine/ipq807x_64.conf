#@TYPE: Machine
#@NAME: IPQ807X_64 machine
#@DESCRIPTION: ipq807x_64

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc
include conf/machine/include/arm/arch-arm64.inc

DEFAULTTUNE = "aarch64"
TARGET_ARCH = "aarch64"
KARCH = "arm64"
DTB_PATH = "qcom"

SOC_FAMILY = "ipq:ipq807x_64"

MACHINE_FEATURES += "usbhost"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"

DISTRO_FEATURES_append = " systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_ARCH = "arm"
UBOOT_MACHINE = "ipq807x_defconfig"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2016"
INITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"

KERNEL_LOADADDR="0x41080000"
KERNEL_DEVICETREE = "ipq8074-hk01.dtb \
                     ipq8074-hk01.c2.dtb \
                     ipq8074-hk01.c3.dtb \
                     ipq8074-hk01.c4.dtb \
                     ipq8074-hk02.dtb \
                     ipq8074-hk06.dtb \
                     ipq8074-hk07.dtb \
                     ipq8074-hk08.dtb \
                     ipq8074-hk09.dtb \
                     ipq8074-hk10.dtb \
                     ipq8074-hk10.c2.dtb \
                     ipq8074-hk14.dtb \
                     ipq8074-ac01.dtb \
                     ipq8074-ac02.dtb \
                     ipq8074-oak02.dtb \
                     ipq8074-oak03.dtb \
		    "

SERIAL_CONSOLE = "115200 ttyMSM0"
