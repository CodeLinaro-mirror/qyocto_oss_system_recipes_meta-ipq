#@TYPE: Machine
#@NAME: IPQ95xx_64 machine
#@DESCRIPTION: ipq95xx_64

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc
include conf/machine/include/arm/armv8a/tune-cortexa72.inc

DEFAULTTUNE = "aarch64"
TARGET_ARCH = "aarch64"
KARCH = "arm64"
DTB_PATH = 'qcom'
SOC_FAMILY = "ipq:ipq95xx_64"
NUM_RADIOS = "radios:3"

MACHINE_FEATURES += "usbhost"

RDEPENDS_${KERNEL_PACKAGE_NAME}-base = ""
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"
PREFERRED_VERSION_lua-native = "5.4.4"
BBMASK .= "|meta-rdk-ext/recipes-connectivity/openssl/openssl_3.0.5.bbappend"

DISTRO_FEATURES:append = " systemd "
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_MACHINE = "ipq9574_norplusnand_defconfig"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-2025"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2025"
EXTRA_IMAGEDEPENDS += "u-boot-2025"

LINUX_VERSION ?= "6.6"

NITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"

KERNEL_LOADADDR="0x40000000"
KERNEL_DEVICETREE ="ipq9574-rdp476.dtb \
		    ipq9574-rdp475.dtb \
		    ipq9574-rdp469.dtb \
		    ipq9574-rdp467.dtb \
		    ipq9574-rdp461.dtb \
		    ipq9574-rdp459.dtb \
		    ipq9574-rdp458.dtb \
		    ipq9574-rdp457.dtb \
		    ipq9574-rdp456.dtb \
		    ipq9574-rdp455-c12.dtb \
		    ipq9574-rdp455-c11.dtb \
		    ipq9574-rdp454.dtb \
		    ipq9574-rdp453.dtb \
		    ipq9574-rdp449.dtb \
		    ipq9574-rdp437.dtb \
		    ipq9574-rdp433-mht-switch.dtb \
		    ipq9574-rdp433-mht-phy.dtb \
		    ipq9574-rdp433.dtb \
		    ipq9574-rdp418.dtb \
		    ipq9574-rdp417.dtb \
		    ipq9574-db-al02-c3.dtb \
		    ipq9574-db-al02-c2.dtb \
		    ipq9574-db-al02-c1.dtb \
		    ipq9574-db-al01-c3.dtb \
		    ipq9574-db-al01-c2.dtb \
		    ipq9574-db-al01-c1.dtb \
                    "
CONF_VERSION = "2"
SERIAL_CONSOLE = "115200 ttyMSM0"
