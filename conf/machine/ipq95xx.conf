#@TYPE: Machine
#@NAME: IPQ95xX machine
#@DESCRIPTION: ipq95xx

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc


SOC_FAMILY = "ipq:ipq95xx"

MACHINE_FEATURES += "usbhost"

RDEPENDS_${KERNEL_PACKAGE_NAME}-base = ""
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"

DISTRO_FEATURES_append = " systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_ARCH = "arm"
UBOOT_MACHINE = "ipq9574_defconfig"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-2016"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2016"
EXTRA_IMAGEDEPENDS += "u-boot-2016"
NITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"
LINUX_VERSION ?= "5.4"

KERNEL_LOADADDR="0x42008000"
KERNEL_DEVICETREE = "ipq9574-al01-c1.dtb \
		     ipq9574-al02-c1.dtb \
                     ipq9574-al02-c2.dtb \
                     ipq9574-al02-c3.dtb \
                     ipq9574-al02-c4.dtb \
		     ipq9574-al02-c5.dtb \
		     ipq9574-al02-c6.dtb \
		     ipq9574-al02-c7.dtb \
		     ipq9574-al02-c8.dtb \
		     ipq9574-al02-c9.dtb \
		     ipq9574-al02-c10.dtb \
		     ipq9574-al02-c11.dtb \
		     ipq9574-al02-c12.dtb \
		     ipq9574-al02-c13.dtb \
		     ipq9574-al02-c14.dtb \
		     ipq9574-al02-c15.dtb \
		     ipq9574-al02-c16.dtb \
		     ipq9574-al02-c17.dtb \
		     ipq9574-al02-c18.dtb \
		     ipq9574-al02-c19.dtb \
		    "

SERIAL_CONSOLE = "115200 ttyMSM0"
