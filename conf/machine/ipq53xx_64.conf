#@TYPE: Machine
#@NAME: IPQ95xx_64 machine
#@DESCRIPTION: ipq53xx_64

include conf/machine/include/ipq-base.inc
include conf/machine/include/ipq-modules.inc
include conf/machine/include/tune-cortexa72.inc

DEFAULTTUNE = "aarch64"
TARGET_ARCH = "aarch64"
KARCH = "arm64"
DTB_PATH = 'qcom'
SOC_FAMILY = "ipq:ipq53xx_64"

MACHINE_FEATURES += "usbhost"

RDEPENDS_${KERNEL_PACKAGE_NAME}-base = ""
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ipq"

DISTRO_FEATURES_append = " systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

UBOOT_ARCH = "arm"
UBOOT_MACHINE = "ipq5332_defconfig"
PREFERRED_PROVIDER_u-boot ?= "u-boot-2016"
NITRAMFS_IMAGE_BUNDLE="1"
KERNEL_IMAGETYPE = "Image"

KERNEL_LOADADDR="0x40080000"
KERNEL_DEVICETREE = "ipq5332-mi01.2.dtb \
		     ipq5332-mi01.2-c2.dtb\
		     ipq5332-mi01.3.dtb \
		     ipq5332-mi01.3-c2.dtb\
		     ipq5332-mi01.3-c3.dtb\
		     ipq5332-mi01.4.dtb \
		     ipq5332-mi01.6.dtb \
		     ipq5332-mi01.7.dtb \
		     ipq5332-mi01.13.dtb \
		    "

SERIAL_CONSOLE = "115200 ttyMSM0"
