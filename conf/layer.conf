# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
HOSTTOOLS:append =" python spatch bzcat lex yacc "

# We have recipes-* directories, add to BBFILES
BBFILES_IPQ += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_SDX = "${LAYERDIR}/packagegroups/*.bb \
		${LAYERDIR}/recipes-wifi/*/*.bb \
		${LAYERDIR}/recipes-wifi/*/*/*.bb \
		${LAYERDIR}/recipes-wifi/*/*.bbappend \
		${LAYERDIR}/recipes-qcawifi/qca-hostapd/*.bb \
		${LAYERDIR}/recipes-packages/wififw-mount/*.bb \
		${LAYERDIR}/recipes-packages/initoverlay/*.bb \
		${LAYERDIR}/recipes-packages/ipq-boot/*.bb"

BBFILES += "${@d.getVar('BBFILES_SDX') if d.getVar('BASEMACHINE') == 'echo' else d.getVar('BBFILES_IPQ')}"

BBFILE_COLLECTIONS += "ipq"
BBFILE_PATTERN_ipq = "^${LAYERDIR}/"
BBFILE_PRIORITY_ipq = "9"
BB_DANGLINGAPPENDS_WARNONLY ?= "true"
USER_CLASSES:remove = "image-mklibs"
PREFERRED_VERSION_iw = "6.9%"
BBMASK += "meta-rdk-ext/recipes-connectivity/iw"
LAYERSERIES_COMPAT_ipq = "kirkstone scarthgap"
