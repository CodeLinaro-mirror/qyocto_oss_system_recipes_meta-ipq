# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
HOSTTOOLS:append =" python spatch bzcat lex yacc "

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ipq"
BBFILE_PATTERN_ipq = "^${LAYERDIR}/"
BBFILE_PRIORITY_ipq = "9"
BB_DANGLINGAPPENDS_WARNONLY ?= "true"
USER_CLASSES:remove = "image-mklibs"
PREFERRED_VERSION_iw = "6.9%"
BBMASK += "meta-rdk-ext/recipes-connectivity/iw"
