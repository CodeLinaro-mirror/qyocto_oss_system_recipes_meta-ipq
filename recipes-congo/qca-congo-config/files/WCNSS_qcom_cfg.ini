num_tx_chains_11g=0x04922924
num_tx_chains_11a=0x04922924

################ Datapath General Begin ################
gEnableFastPath=1                  # Enable fast path to bypass host networking stack for forwarding
legacy_mode_csum_disable=1         # Disable checksum computation in legacy TX mode (offloaded to HW)
dp_offload_tx_csum_support=1       # Advertise NETIF_F_HW_CSUM on STA netdev so SFE sets CSUM_OFFLOAD on connections
icmp_req_to_fw_mark_interval=200   # Interval (ms) between marking ICMP requests to firmware
dp_direct_link_enable=1            # Enable direct inter-radio link (IPQ host <-> QCN9224 target)
dp_enable_load_balance=1           # Distribute TX traffic across multiple TCL rings by load
dp_enable_flow_balance=0           # Disable flow balance; rely on 8-REO-ring hash spread instead
dp_enable_lapb=1                   # Enable Least Active Port Balancing for TX ring selection
gEnableSWLM=1                      # Coalesce TCL doorbell writes at high tput to reduce PCIe MMIO overhead
dp_stc_enable=1                    # Enable Software Traffic Classification for QoS steering
dp_txrx_intr_cpumask=0xf           # CPU affinity mask for TX/RX interrupt handler threads (CPUs 0-3)
dp_irq_affinity_mask=0xf           # CPU affinity mask for DP NAPI/tasklet IRQ processing (CPUs 0-3)
gBusBandwidthVeryHighThreshold=1000 # Bus bandwidth threshold (Mbps) to trigger very-high perf mode
gBusBandwidthComputeInterval=10000  # Bus bandwidth computation interval in ms (max)
ce_service_max_yield_time=2000      # Max time (µs) CE service loop runs before yielding; default 500µs
################ Datapath General End ################

################ Datapath TX Begin ################
dp_tcl_data_rings=4                # Number of TCL (Transmit Classifier Logic) data rings
dp_tx_comp_rings=4                 # Number of TX completion (WBM2SW) rings
dp_tx_ring_size=16384              # Descriptors per TCL data ring (must be power of 2)
dp_tx_compl_ring_size=16384        # Descriptors per TX completion ring (must be power of 2)
tx_comp_loop_pkt_limit=1024        # Max descs reaped per ring-open/close in dp_tx_comp_handler; default 64 causes 16 MMIO writes/NAPI poll
dp_tx_ext_desc=0x2000              # TX extended descriptor pool for scatter-gather (8192 entries)
dp_tx_page_pool=0                  # Disable static TX page pool allocation
tx_dynamic_page_pool_config=0      # Disable dynamic TX page pool resizing
TSOEnable=0                        # Disable TCP Segmentation Offload in hardware
tx_powerboost=1                    # Enable TX power boost for higher throughput under load
ght_mpdu_density=5                 # Minimum MPDU start spacing for A-MPDU aggregation (5 = 4 us)
dp_tx_desc_pool_0=16384
dp_tx_desc_pool_1=16384
dp_tx_desc_pool_2=16384
dp_tx_desc_pool_3=16384
dp_tx_spl_desc=16384
dp_int_batch_threshold_tx=256          # Coalesce up to 256 TX-completion descs before raising IRQ (default 1)
dp_int_timer_threshold_tx=1000         # Fallback IRQ timer for TX completion: 1000 µs (default 8)
################ Datapath TX End ################

################ Datapath RX Begin ################
rx_mode=4                          # RX processing mode: 4 = multi-threaded NAPI
dp_num_rx_context=4                # Number of RX NAPI/interrupt contexts (one per CPU typically)
dp_rxdma_buf_ring=4096             # RXDMA host buffer ring size (descriptors)
#dp_rxdma_refill_ring=16384        # Legacy RXDMA refill ring size (superseded by dp_direct_refill_ring)
dp_rx_sw_desc_num=32768            # RX software descriptor pool size (2× direct_refill_ring to cover in-flight frames)
dp_direct_refill_ring=16384        # Direct buffer refill ring size; bypasses RXDMA refill thread
dp_rx_refill_buff_pool=0           # Disabled: NO_MAP_UNMAP replenish uses dp_rx_nbuf_alloc()/SKB recycler, never reads refill_buff_pool
dp_reo_dst_ring=8192               # REO (Reorder) destination ring size per ring (descriptors)
dp_reo_rings_map=0x0F              # Bitmask selecting active REO destination rings (rings 0-3)
dp_rx_flow_search_table_size=256   # Number of entries in the RX flow search table (FST)
dp_rx_fst_in_cmem=1                # 1: FST in CMEM (on-chip, lower latency, flow_deletion=1); 0: FST in DDR
dp_rx_fisa_enable=1                # Enable FISA for flow trace debug (fisa_pkt_tlv/ft_miss/ft_hit prints)
dp_rx_rr=1                         # Disable FISA RR ring reassignment (prevent rdi_mismatch→SFE flush loop)
dp_rx_fisa_aggr_enable=0           # Disable FISA coalescing (now wired to CFG_DP_RX_FISA_AGGR_ENABLE); flow steering via dp_rx_fisa_enable=1 still active
dp_rx_fisa_udp_sta_enable=0        # Disable FISA aggregation for UDP STA flows (skip coalescing, deliver per-packet like TCP)
dp_rx_fisa_tcp_enable=1            # Enable FST RR steering for TCP flows (AP+STA) without aggregation
gRxAggregationSize=1024            # Maximum A-MPDU RX aggregation window size (BAs)
GROEnable=0                        # Disable Generic Receive Offload (GRO) in host network stack
dp_rx_buffer_recycle=0             # Disable RX buffer recycling (allocate fresh buffers each time)
dp_rx_pending_lo_threshold=32767   # Low watermark for pending RX buffer count before refill wakeup
dp_rx_pending_hl_threshold=32767   # High watermark for pending RX buffer count to throttle refill
dp_rx_intr_cpumask=0xf             # CPU affinity mask for RX interrupt handling (CPUs 0-3)
dp_tx_comp_intr_cpumask=0xf        # CPU affinity mask for TX completion ring IRQs (wlan_grp_dp_0→CPU0 … _3→CPU3)
ghw_cc_enable=0                    # Disable HW cookie conversion
dp_int_batch_threshold_rx=64           # Coalesce up to 64 RX descs before raising REO IRQ (default 1)
dp_int_timer_threshold_rx=200          # Fallback IRQ timer for RX REO ring: 200 µs (default 8)
#dp_rx_refill_buff_pool_size=65536 # RX refill pool size option A (large, for high-throughput)
#dp_rx_refill_thrd_threshold=16384 # Refill thread trigger threshold for option A
#dp_rx_refill_buff_pool_size=16384 # RX refill pool size option B (balanced)
#dp_rx_refill_thrd_threshold=4096  # Refill thread trigger threshold for option B
#dp_rx_pp_warmup_multiplier=5      # Page pool warmup multiplier at init (pre-allocate 5x pages)
################ Datapath RX End ################

# Spectral Scan - disabled
spectral_disable=1                 # Disable spectral scan feature
poison_spectral_bufs=0             # Do not poison spectral scan buffers on free
spectral_data_transport_mechanism=0 # Spectral data transport: 0 = not used

# CFR - disabled
cfr_disable=0x7                    # Disable all CFR (Channel Frequency Response) capture types

# Monitor Mode - disabled
full_mon_mode=0                    # Disable full monitor (promiscuous) mode
packet_capture_mode=0              # Disable packet capture mode
local_packet_capture=0             # Disable local (host-side) packet capture

# Monitor Ring Buffers - minimized
dp_rxdma_monitor_buf_ring=16       # RXDMA monitor buffer ring size (minimized, monitor not used)
dp_tx_monitor_buf_ring=16          # TX monitor buffer ring size (minimized)
dp_rxdma_monitor_dst_ring=48       # RXDMA monitor destination ring size
dp_tx_monitor_dst_ring=48          # TX monitor destination ring size
dp_rxdma_monitor_status_ring=16    # RXDMA monitor status ring size
dp_rxdma_monitor_desc_ring=4096    # RXDMA monitor descriptor ring size
dp_rx_mon_wq_threshold=8           # RX monitor workqueue flush threshold (packets)
dp_rx_mon_wq_depth=1               # RX monitor workqueue max depth
mon_drop_thresh=0                  # Monitor drop threshold: 0 = drop immediately when ring full

